{% extends "base.html" %}

{% block title %}Log In - UniSwap{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 0 auto;">
    <div class="card">
        <div class="card-header">
            <h2>Campus Login</h2>
        </div>

        <form method="post">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="alert alert-error">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" autofocus required id="id_username" class="form-control" placeholder="Your username">
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" required id="id_password" class="form-control" placeholder="Your password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>

        <p style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-muted);">
            Need an account? <a href="{% url 'accounts:signup' %}">Sign up with your college email</a>
        </p>
    </div>
</div>
{% endblock %}
